name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: architecture, performance and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high
      - name: Typecheck, architecture, lint regression, assets and production budget
        run: npm run verify
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Domain and desktop, Android, iOS browser tests in light and dark
        run: npm run test:browser
      - name: Captcha expiry and recovery (mock provider, no live submissions)
        run: npx playwright test --project=security-widget --project=security-widget-android --project=security-widget-ios
        env:
          SECURITY_WIDGET_TEST: '1'
      - name: Preserve reports and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-results
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
