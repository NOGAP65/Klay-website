name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: architecture, performance and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit deployed dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck, architecture, lint regression, assets and production budget
        run: npm run verify
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Domain and desktop, Android, iOS browser tests in light and dark
        run: npm run test:browser
      - name: Preserve reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
      - name: Audit development dependencies (advisory)
        run: npm audit
        continue-on-error: true
