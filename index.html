<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/brand/klay-mark.png" />
    <meta name="theme-color" content="#303030" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klay Interiors — Made-to-Measure Window Coverings</title>
    <meta name="description" content="Premium Australian made-to-measure blinds, curtains and shutters. Designed with you, installed by hand across Victoria." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      /* Cormorant Garamond 500 is deliberately NOT requested. Google serves a
         @font-face for it whose woff2 404s at gstatic, so asking for it bought a
         failed request and a console error on every page load and loaded nothing:
         document.fonts.check('500 40px "Cormorant Garamond"') came back false
         while every other face here came back true. Nothing live uses it either —
         the one call site was ProcessScene, which is imported nowhere.

         Keep it out unless a real weight-500 need appears, and if one does, check
         the file actually resolves before relying on it. */
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap');

      /* The custom properties that used to live here were dead — nothing in
         src referenced var(--anything), and the values had drifted off the
         palette in src/theme.ts, which is the one source of truth. */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* NO BROWSER BLUE. An audit of the running pages found #0000EE — the UA's
         default link colour — on 823 elements: every <a> that styles its text in
         a child span rather than on itself keeps the default on the anchor. None
         of them showed while the children were painted over the top, but the
         palette has no chroma in it and one unstyled anchor would have been the
         only colour on the site. Inherit is the correct default here because
         every link on this site is coloured by the surface it sits on. */
      a {
        color: inherit;
      }

      html {
        scroll-behavior: smooth;
      }

      /* #303030, matching tokens.charcoal, which is the value sampled off the
         logo artwork. Only ever seen behind a short page or past the end of a
         scroll. The note this replaces argued for warmth over #1A1A1A — that
         argument is void now the palette has no warm axis to protect. */
      body {
        background: #303030;
        color: #F8F8F8;
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        line-height: 1.6;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Selection was the gold fill with ink on it. Inverted rather than
         greyed: ink ground, paper text. A grey selection band is invisible
         against a grey palette, and inversion is what every neutral site does. */
      ::selection {
        background: #1D1D1D;
        color: #F8F8F8;
      }

      /* The horizontal rails on the homepage — the category strip and the range
         carousel. Both scroll with the wheel, a trackpad or the arrow buttons,
         and neither wants a scrollbar drawn under the photographs. A
         ::-webkit-scrollbar rule can't be expressed as an inline style, which
         is why this one selector lives here rather than in the component. */
      .klay-hscroll {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .klay-hscroll::-webkit-scrollbar {
        display: none;
      }

      /* CONTAINMENT ON THE RANGE SLOTS. Their flex-basis animates when a card
         opens, and without a containment boundary the browser has to consider
         the whole row's subtree on every frame of that transition — measured at
         432 style recalculations for one card opening. `layout` tells it nothing
         inside a slot affects the layout of anything outside it, so the per-frame
         work is scoped to the one card that is actually changing.

         LAYOUT ONLY, NOT `layout paint`. Paint containment clips every descendant
         to the slot's own box, which is fine for a card that sits flat inside it
         and fatal for one that lifts: the range cards carry a resting shadow and
         a larger one on hover, and both were being cut off at the slot edge —
         about 4px of a 20px blur survived. Layout containment is where the
         per-frame saving comes from anyway; the clipping was never the point. */
      .klay-slot {
        contain: layout;
      }

      /* The opposite case: the field column inside a range card's configurator.
         Every card in that row is the same height, so the one product with a
         seventeen-colour card has to scroll inside its own panel — and there
         the scrollbar is the only thing saying there is more to choose from, so
         it stays. Thin and ink at low opacity, because it sits inside a card
         rather than at the edge of the window. */
      .klay-vscroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(29, 29, 29, 0.2) transparent;
      }
      .klay-vscroll::-webkit-scrollbar {
        width: 4px;
      }
      .klay-vscroll::-webkit-scrollbar-thumb {
        background: rgba(29, 29, 29, 0.2);
        border-radius: 2px;
      }
      .klay-vscroll::-webkit-scrollbar-track {
        background: transparent;
      }

      @keyframes klay-orb {
        0%   { transform: translate(0, 0) scale(1); }
        33%  { transform: translate(18vw, 8vh) scale(1.15); }
        66%  { transform: translate(-10vw, 16vh) scale(0.9); }
        100% { transform: translate(0, 0) scale(1); }
      }

      @keyframes klay-breathe {
        0%   { transform: translateY(0); }
        50%  { transform: translateY(6px); }
        100% { transform: translateY(0); }
      }

      @keyframes klay-marquee {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      @keyframes klay-testimonials {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      /* The range card's configuration panel, sliding into the space the row
         has just opened for it. Fade plus a short travel from the left, so it
         reads as coming OUT of the card rather than appearing beside it. */
      @keyframes klay-panel-in {
        0%   { opacity: 0; transform: translateX(-12px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @keyframes klay-scroll-hint {
        0%   { transform: scaleY(0); transform-origin: top; }
        50%  { transform: scaleY(1); transform-origin: top; }
        50.1%{ transform: scaleY(1); transform-origin: bottom; }
        100% { transform: scaleY(0); transform-origin: bottom; }
      }

      @keyframes klay-visualiser-blind {
        0%   { height: 20%; }
        50%  { height: 82%; }
        100% { height: 20%; }
      }

      @keyframes klay-dawn {
        0%   { opacity: 0.05; transform: scale(1); }
        50%  { opacity: 0.5; transform: scale(1.08); }
        100% { opacity: 0.05; transform: scale(1); }
      }

      @keyframes klay-starburst {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes klay-pulse {
        0%   { opacity: 0.06; transform: scale(0.95); }
        50%  { opacity: 0.16; transform: scale(1.05); }
        100% { opacity: 0.06; transform: scale(0.95); }
      }

      @keyframes klay-orbit {
        0%   { transform: translate(0, 0); }
        25%  { transform: translate(8vw, -6vh); }
        50%  { transform: translate(-6vw, 4vh); }
        75%  { transform: translate(4vw, 8vh); }
        100% { transform: translate(0, 0); }
      }

      @keyframes klay-kenburns {
        0%   { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
