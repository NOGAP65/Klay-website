[build]
  command = "npm run verify"
  publish = "dist"

[build.environment]
  # PINNED, BECAUSE THE DEFAULT DRIFTS. Netlify picks its own Node version when
  # none is named, and that default moves over time — so the build that ships
  # could quietly change engine underneath a lockfile that never did. Vite 8
  # requires ^20.19 || >=22.12, which makes an unpinned default a real failure
  # mode rather than a tidiness point: a rollback to an older default would stop
  # the site building at all.
  #
  # 22 matches .nvmrc and the engines floor in package.json, so a developer's
  # machine, CI and the deploy are all on the same major.
  NODE_VERSION = "22"

  # VITE_SUPABASE_URL is intentionally public — it's a VITE_ prefixed variable
  # that goes into the browser bundle by design. Tell Netlify's secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL"

[functions]
  directory = "netlify/functions"
  # esbuild so the TypeScript functions — and the src/lib/pricing module they
  # share with the browser — get bundled rather than shipped as raw .ts.
  node_bundler = "esbuild"

# The webhook needs Stripe's exact bytes to verify the signature, so it must not
# be parsed or re-encoded on the way in.
[functions."stripe-webhook"]
  included_files = []

# --- security headers --------------------------------------------------------
# Applied to all responses. CSP is deliberately strict: default-src 'self' with
# explicit exceptions only for Cloudflare Turnstile (captcha), Stripe, Supabase,
# and Google Fonts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';"

# Vite filenames contain content hashes; unversioned public images do not.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- routing -----------------------------------------------------------------
# Only the four implemented API endpoints are mapped. Unknown API paths do not
# fall through to the app. Each handler also declares its Functions 2.0 path.
[[redirects]]
  from = "/api/request-quote"
  to = "/.netlify/functions/request-quote"
  status = 200

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/order-status"
  to = "/.netlify/functions/order-status"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Build metadata is used by local verification, never by the public app.
[[redirects]]
  from = "/.vite/*"
  to = "/404.html"
  status = 404
  force = true

# Exact customer routes only. Tests check these against src/config/routes.ts.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/products"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/visualiser"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/how-it-works"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/book"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/booking/confirmed"
  to = "/index.html"
  status = 200

# Retired pages and missing files return an actual 404 without loading the app.
# Existing static assets still win through Netlify's normal file shadowing.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
